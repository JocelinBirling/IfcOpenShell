# This file was generated with the assistance of an AI coding tool.
name: Build BonsaiViewer (macOS)

# Builds BonsaiViewer for macOS from this repository on GitHub runners and
# uploads the result as a workflow artifact. One workflow per platform, so
# each one runs on its own. macOS runs on the runner of the official macOS build
# (build-ifcopenshell-macos.yml).

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  macos:
    name: macos-arm64
    # Same runner as the official macOS build (build-ifcopenshell-macos.yml).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Qt (macOS)
        run: |
          brew install qt
          echo "QT_DIR=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Install Ninja
        run: uv tool install ninja

      # The packaging step builds the Autodesk connector (Rust) shipped with the viewer.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # --shared as on Linux and in the official macOS build: the packaging
      # step bundles the IfcOpenShell libraries next to the app.
      - name: Build BonsaiViewer
        shell: bash
        env:
          QT6_VERSION: '6.8.3'
        run: |
          set -o pipefail
          uv run --python 3.13 nix/build-all.py BonsaiViewer \
            -v --shared --use-ninja --build-cfg Release \
            2>&1 | tee build.log

      # Zips BonsaiViewer.app with its libraries, Qt and the connector.
      - name: Package BonsaiViewer
        shell: bash
        env:
          QT6_VERSION: '6.8.3'
        run: |
          set -euo pipefail
          uv run --python 3.13 nix/package-zip-archives.py macosm164
          mkdir -p dist
          cp "$HOME"/output/BonsaiViewer-*.zip dist/

      - name: Upload BonsaiViewer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bonsaiviewer-macos-arm64
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-macos-arm64
          path: |
            build.log
            build/*/*/*/logs/
            build/**/CMakeFiles/*.log
          if-no-files-found: warn
          retention-days: 7
